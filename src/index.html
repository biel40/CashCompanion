<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CashCompanion</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F5F4EF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Controla tus gastos y suscripciones de un vistazo." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('cc.theme');
          var dark =
            preference === 'dark' ||
            (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset['theme'] = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
